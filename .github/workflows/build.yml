name: Build NoSleep

on:
  push:
  workflow_dispatch:

# 默认只读；只有发布 Release 的 job 才单独申请写权限。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Show toolchain versions
        run: |
          gcc --version
          windres --version

      - name: Build (warnings as errors)
        run: make EXTRA_CFLAGS=-Werror

      - name: Verify output
        run: |
          ls -l nosleep_pure.exe
          file nosleep_pure.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nosleep-pure-exe
          path: nosleep_pure.exe
          if-no-files-found: error

  # 推送 v* 标签时，自动创建 GitHub Release 并附上 exe（下载无需登录）。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: nosleep-pure-exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nosleep_pure.exe
          name: NoSleep ${{ github.ref_name }}
          generate_release_notes: true
